<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Storm Probe</title>
<link rel="manifest" href="manifest.json">
<style>
html,body{margin:0;overflow:hidden;background:#07111f;color:white;font-family:Arial}
#ui{position:fixed;inset:0;pointer-events:none}
.btn{pointer-events:auto;background:#123457;border:2px solid #5ab7ff;padding:14px;border-radius:16px;margin:8px;color:white}
#menu{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;flex-direction:column}
</style>
</head>
<body>
<div id="ui">
<div id="menu">
<button class="btn" id="play">🌪 ИГРАТЬ</button>
<button class="btn" id="garage">🔧 ГАРАЖ</button>
<button class="btn" id="fullscreen">⛶ FULLSCREEN</button>
</div>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script type="module" src="./js/main.js"></script>
</body>
</html>
